name: Lint workflows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: '${{ github.workspace }}/go.mod'

    - name: actionlint
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

    - name: zizmor
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
      with:
        version: 1.25.2
        # Fail the job on findings instead of uploading SARIF, which needs
        # security-events: write and is not available to pull requests from forks.
        advanced-security: false
        annotations: true
