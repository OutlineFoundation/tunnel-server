name: Lint workflows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        # This job builds linting tools rather than the project, so it does not
        # follow either module's Go version. setup-go pins GOTOOLCHAIN=local,
        # so the toolchain here must already satisfy the tools: actionlint
        # v1.7.12 requires Go >= 1.25, the root module is still on Go 1.24.
        go-version: 'stable'

    - name: actionlint
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

    - name: zizmor
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
      with:
        version: 1.25.2
        # annotations: true is mutually exclusive with the SARIF upload this
        # action does by default. Switching to SARIF would also need
        # security-events: write, which pull requests from forks cannot be
        # granted.
        advanced-security: false
        annotations: true
