name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "0 13 * * *"  # Run daily at 1PM UTC.

permissions:  # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:

  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry is a separate Go module; `./...` from the repository root
        # does not reach outlinecaddy.
        include:
          - name: tunnel-server
            dir: .
          - name: outlinecaddy
            dir: outlinecaddy
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: '${{ matrix.dir }}/go.mod'
        cache-dependency-path: '${{ matrix.dir }}/go.sum'

    - name: Get dependencies
      run: |
        # Download GeoIP test data from MaxMind
        git submodule update --init

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -race -benchmem -bench=. ./... -benchtime=100ms
